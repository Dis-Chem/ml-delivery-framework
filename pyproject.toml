[project]
name = "ml-delivery-framework"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "databricks>=0.2.0",
    "mlflow>=3.1,<4",
    "pandas>=2.3.3",
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "kedro[jupyter]>=1.0.0",
    "kedro-datasets[spark,pandas,spark-sparkdataset,pandas-parquetdataset]>=9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["kedro-python", "mlops-stacks"]
