[project]
name = "ml-delivery-framework"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "databricks>=0.2.0",
    "kedro>=1.5.0",
    "mlflow>=3.1,<4",
    "pandas>=2.3.3",
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-black>=0.6.0",
]
