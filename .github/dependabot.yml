version: 2
updates:
  # 1. Python Package Updates via uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      # Combines updates into a single PR so uv.lock doesn't hit git conflicts
      python-dependencies:
        patterns:
          - "*"

  # 2. Global GitHub Actions Check (Kept from your initial config)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
