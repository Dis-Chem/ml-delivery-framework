name: Run checks
on:
  pull_request:

# Least-privilege default token: fork PRs only ever get read access.
permissions:
  contents: read

jobs:
  detect-templates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: |
          # Find all directories containing a template schema and format as a JSON array
          DIRS=$(find . -maxdepth 2 -name "databricks_template_schema.json" -exec dirname {} \; | sed 's|./||' | jq -R -s -c 'split("\n") | del(.[] | select(. == ""))')
          echo "matrix=${DIRS}" >> "$GITHUB_OUTPUT"

  run-tests:
    needs: detect-templates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template_dir: ${{ fromJson(needs.detect-templates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # PySpark requires a Java Runtime Environment (JVM) to run its underlying coordination engine.
      # Adding this step ensures a valid Java version is available both in GitHub Actions and local 'act' runner environments.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          # Fix: Scope the cache dependency to the specific matrix template directory
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        # Fix: Force uv to look inside the specific template directory
        run: |
          uv sync --all-extras --dev

      - name: Run tests
        # Fix: Execute pytest with the template directory scoped flag
        run: |
          uv run pytest --template-path="${{ matrix.template_dir }}"
