name: Auto Tag Templates
on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      # Watch the entire template directory tree for release tag triggers
      - '*/template/**'

permissions:
  contents: write

jobs:
  calculate-and-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Templates
        id: changed-dirs
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '^[^/]+/template/' | cut -d'/' -f1 | sort -u | tr '\n' ' ')
          echo "dirs=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Calculate Version and Push Tag
        if: steps.changed-dirs.outputs.dirs != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          for dir in ${{ steps.changed-dirs.outputs.dirs }}; do
            echo "Processing tags for directory: ${dir}"
            
            LATEST_TAG=$(git tag -l "${dir}-v*" | sort -V | tail -n1)
            
            if [ -z "$LATEST_TAG" ]; then
              NEXT_VERSION="1.0.0"
            else
              VERSION_NUM=${LATEST_TAG##*-v}
              IFS='.' read -r major minor patch <<< "$VERSION_NUM"
              patch=$((patch + 1))
              NEXT_VERSION="$major.$minor.$patch"
            fi
            
            NEW_TAG="${dir}-v${NEXT_VERSION}"
            echo "Computed target tag: ${NEW_TAG}"
            
            git tag -a "$NEW_TAG" -m "Automated release of ${dir} template version ${NEXT_VERSION}"
            git push origin "$NEW_TAG"
          done
