name: Generate CICD Zip
on:
  pull_request:
    branches:
      - main
    paths:
      # Watch ALL files inside any template root directory
      - '*/template/**'
      # Ignore the generated archive itself to prevent an infinite loop
      - '!**/cicd.tar.gz'

permissions:
  contents: write

jobs:
  detect-and-generate-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Step 1: Detect which top-level template subfolders actually changed
      - name: Detect Changed Templates
        id: changed-dirs
        run: |
          # Matches paths starting with <dir-name>/template/
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '^[^/]+/template/' | cut -d'/' -f1 | sort -u | tr '\n' ' ')
          echo "dirs=${CHANGED}" >> "$GITHUB_OUTPUT"

      # Step 2: Loop over every changed template subfolder and regenerate its localized cicd.tar.gz
      - name: Generate CICD Zips
        if: steps.changed-dirs.outputs.dirs != ''
        run: |
          for dir in ${{ steps.changed-dirs.outputs.dirs }}; do
            echo "Processing template directory: ${dir}"
            
            cd "$dir/template"
            
            # Ensure target directory path exists
            mkdir -p cicd/template
            
            # Pack the workflows into the bundle matching original structure
            cp --parents .github/workflows/* cicd/template 2>/dev/null || true
            tar -czvf cicd.tar.gz cicd
            
            cd -
          done

      # Step 3: Push the updated zip files directly back into the open PR branch
      - name: Commit and Push Changes back to PR
        if: steps.changed-dirs.outputs.dirs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          git add **/cicd.tar.gz
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(cicd): auto-regenerate cicd.tar.gz due to template modifications"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No archive payload variations detected. Skipping commit."
          fi
